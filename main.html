<body>
    <div class="feature-container">
        <div class="feature-card">
            <a href="recommendedFood.html" class="feature-link">
                <div class="feature-icon">🥗</div>
                <h3>Recommended Food</h3>
                <p>Personalized meals just for you</p>
            </a>
        </div>
        <div class="feature-card">
            <a href="googleMap.html" class="feature-link">

                <h3>Nearby Maps</h3>

    <div class="health-section">
        <h2 class="section-title">Your Health Report</h2>

                <h3>📊 BMI</h3>
                <div class="bmi-value">--</div>
                <div class="bmi-status">Loading...</div>
                <div class="bmi-range">Fetching your health data</div>
                <button class="health-btn">Update</button>
            </div>
            
            <div class="health-card nutrients-card">
                <h3>🥬 Missing Nutrients</h3>
                <ul class="nutrients-list">
                    <li style="display: flex; justify-content: center; padding: 20px; color: #5a7c63;">
                        ⏳ Loading your nutrition data...
                    </li>
                </ul>
                <button class="health-btn">View Details</button>
            </div>
        </div>
    </div>

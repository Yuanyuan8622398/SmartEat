<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEat - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2 id="formTitle">Welcome Back!</h2>
                <p id="formSubtitle" class="login-subtitle">
                    Login to continue your healthy journey
                </p>
            </div>
            
            <div id="error" class="error-message"></div>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <div class="button-group">
                <button id="actionBtn" onclick="handleSubmit()" class="login-btn">Login</button>
            </div>
            
            <div class="toggle-section">
                <p id="toggleText">
                    <span id="toggleMessage">New here? </span>
                    <a href="#" id="toggleLink" onclick="toggleMode()">Create Account</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2r9SpnJYI2SytIuWgpCNuqpVM82CJs9U",
            authDomain: "smarteat-kitahack2026.firebaseapp.com",
            projectId: "smarteat-kitahack2026",
            storageBucket: "smarteat-kitahack2026.firebasestorage.app",
            messagingSenderId: "1070256092865",
            appId: "1:1070256092865:web:a2fab330a22169f24a4640"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .then(() => {
                console.log("✅ Persistence set to LOCAL");
            })
            .catch((error) => {
                console.error("❌ Persistence error:", error);
            });

        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            updateUI();
            document.getElementById('error').textContent = '';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        function updateUI() {
            const title = document.getElementById('formTitle');
            const subtitle = document.getElementById('formSubtitle');
            const actionBtn = document.getElementById('actionBtn');
            const toggleMessage = document.getElementById('toggleMessage');
            const toggleLink = document.getElementById('toggleLink');

            if (isLoginMode) {
                title.textContent = 'Welcome Back!';
                subtitle.textContent = 'Login to continue your healthy journey';
                actionBtn.innerHTML = '🔐 Login';
                toggleMessage.textContent = 'New here? ';
                toggleLink.textContent = 'Create Account';
            } else {
                title.textContent = 'Join SmartEat!';
                subtitle.textContent = 'Create an account to start your healthy journey';
                actionBtn.innerHTML = '✨ Sign Up';
                toggleMessage.textContent = 'Already have an account? ';
                toggleLink.textContent = 'Login';
            }
        }

        function handleSubmit() {
            if (isLoginMode) {
                login();
            } else {
                signup();
            }
        }

        function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error');
            
            errorDiv.textContent = '';
            
            if (!email || !password) {
                errorDiv.textContent = 'Please fill in all fields';
                return;
            }

            const loginBtn = document.getElementById('actionBtn');
            const originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = '⏳ Signing In...';
            loginBtn.disabled = true;
            
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    console.log('✅ Login successful:', userCredential.user.email);
                    
                    return db.collection('users').doc(userCredential.user.uid).update({
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    errorDiv.textContent = '✅ Login successful! Redirecting...';
                    errorDiv.style.color = '#4CAF50';
                    setTimeout(() => {
                        window.location.href = 'main.html';
                    }, 1000);
                })
                .catch((error) => {
                    console.error('❌ Login error:', error.code, error.message);
                    
                    switch(error.code) {
                        case 'auth/invalid-credential':
                        case 'auth/invalid-login-credentials':
                        case 'auth/wrong-password':
                        case 'auth/user-not-found':
                            errorDiv.textContent = '❌ Incorrect email or password. Please try again.';
                            break;
                        case 'auth/invalid-email':
                            errorDiv.textContent = '❌ Invalid email format.';
                            break;
                        case 'auth/too-many-requests':
                            errorDiv.textContent = '❌ Too many failed attempts. Please try again later.';
                            break;
                        case 'auth/user-disabled':
                            errorDiv.textContent = '❌ This account has been disabled.';
                            break;
                        case 'auth/network-request-failed':
                            errorDiv.textContent = '❌ Network error. Please check your connection.';
                            break;
                        default:
                            errorDiv.textContent = '❌ Login failed. Please try again.';
                    }
                    errorDiv.style.color = '#f44336';
                })
                .finally(() => {
                    loginBtn.innerHTML = originalText;
                    loginBtn.disabled = false;
                });
        }

        async function signup() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error');
            
            errorDiv.textContent = '';
            errorDiv.style.color = '#f44336';
            
            if (!email || !password) {
                errorDiv.textContent = 'Please fill in all fields';
                return;
            }
            
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                errorDiv.textContent = '❌ Please enter a valid email address';
                return;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = '❌ Password must be at least 6 characters';
                return;
            }
            
            const signupBtn = document.getElementById('actionBtn');
            const originalText = signupBtn.innerHTML;
            signupBtn.innerHTML = '⏳ Creating Account...';
            signupBtn.disabled = true;
            
            try {
                const methods = await auth.fetchSignInMethodsForEmail(email);
                if (methods.length > 0) {
                    errorDiv.textContent = '❌ This email is already registered. Please sign in instead.';
                    signupBtn.innerHTML = originalText;
                    signupBtn.disabled = false;
                    return;
                }
            } catch (checkError) {
                console.error('Error checking email:', checkError);
            }
            
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log('✅ Account created:', user.email);
                    
                    return db.collection('users').doc(user.uid).set({
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        profile: {
                            name: '',
                            age: null,
                            weight: null,
                            height: null,
                            gender: '',
                            diet: '',
                            foodType: '',
                            goal: 'maintenance'
                        },
                        deficiencies: [],
                        mealPlan: []
                    });
                })
                .then(() => {
                    errorDiv.textContent = '✅ Account created! Redirecting to profile...';
                    errorDiv.style.color = '#4CAF50';
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 1000);
                })
                .catch((error) => {
                    console.error('❌ Signup error:', error.code);
                    
                    switch(error.code) {
                        case 'auth/email-already-in-use':
                            errorDiv.textContent = '❌ Email already in use. Please sign in instead.';
                            break;
                        case 'auth/invalid-email':
                            errorDiv.textContent = '❌ Invalid email format.';
                            break;
                        case 'auth/weak-password':
                            errorDiv.textContent = '❌ Password is too weak.';
                            break;
                        case 'auth/network-request-failed':
                            errorDiv.textContent = '❌ Network error. Please check your connection.';
                            break;
                        default:
                            errorDiv.textContent = '❌ Signup failed. Please try again.';
                    }
                })
                .finally(() => {
                    signupBtn.innerHTML = originalText;
                    signupBtn.disabled = false;
                });
        }
    </script>

    <script src="header.js"></script>
</body>
</html>
